name: Generate Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch: {}
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate contribution snake
        uses: leereilly/contribution-graph-art@v1
        with:
          github_user_name: Aaron9115
          github_token: ${{ secrets.GITHUB_TOKEN }}
          animation_mode: "snake"
          food_count: "15"
          output_path: dist/github-contribution-snake.svg
          palette: "github-dark"

      - name: Push generated file to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
