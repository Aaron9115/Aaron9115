name: Generate Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch: {}
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest

    steps:
      - name: Generate snake game from GitHub contribution grid
        uses: Platane/snk@v3
        id: snake
        with:
          github_user_name: Aaron9115
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=%2339D353&color_dots=%23161B22,%230E4429,%23006D32,%2326A641,%2339D353&color_background=%230D1117
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=%2339D353
            dist/github-contribution-grid-snake-green.gif?color_snake=%2339D353&color_dots=%23161B22,%230E4429,%23006D32,%2326A641,%2339D353&color_background=%230D1117

      - name: Push generated files to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
