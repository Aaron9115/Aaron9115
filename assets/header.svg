<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="300" viewBox="0 0 1200 300">

  <defs>
    <!-- Purple bubble gradient -->
    <linearGradient id="bubbleGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7C3AED"/>
      <stop offset="45%" stop-color="#A855F7"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
      <animate attributeName="x1" values="0%;100%;0%" dur="8s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="100%;0%;100%" dur="8s" repeatCount="indefinite"/>
    </linearGradient>

    <!-- Soft bubble glow -->
    <filter id="bubbleGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="7"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Tiny particle glow -->
    <filter id="particleGlow" x="-200%" y="-200%" width="400%" height="400%">
      <feGaussianBlur stdDeviation="2.5"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!--
    NO BACKGROUND RECTANGLE.
    The SVG itself is transparent so GitHub's dark README background
    shows through naturally.
  -->

  <!-- Very subtle moving particles -->
  <g filter="url(#particleGlow)">
    <circle cx="405" cy="128" r="1.8" fill="#A855F7">
      <animate attributeName="cx" values="405;425;405" dur="5s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="128;110;128" dur="5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values=".2;.9;.2" dur="5s" repeatCount="indefinite"/>
    </circle>

    <circle cx="705" cy="125" r="1.7" fill="#C084FC">
      <animate attributeName="cx" values="705;685;705" dur="5.8s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="125;142;125" dur="5.8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values=".15;.85;.15" dur="5.8s" repeatCount="indefinite"/>
    </circle>

    <circle cx="450" cy="205" r="1.6" fill="#22D3EE">
      <animate attributeName="cy" values="205;220;205" dur="4.8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values=".15;.7;.15" dur="4.8s" repeatCount="indefinite"/>
    </circle>

    <circle cx="750" cy="205" r="1.6" fill="#A855F7">
      <animate attributeName="cy" values="205;188;205" dur="5.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values=".15;.8;.15" dur="5.2s" repeatCount="indefinite"/>
    </circle>

    <circle cx="475" cy="98" r="1.4" fill="#22D3EE">
      <animate attributeName="opacity" values=".1;.9;.1" dur="3.2s" repeatCount="indefinite"/>
    </circle>

    <circle cx="725" cy="100" r="1.4" fill="#A855F7">
      <animate attributeName="opacity" values=".1;.9;.1" dur="3.7s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Smooth floating / morphing bubble -->
  <g filter="url(#bubbleGlow)">
    <path fill="url(#bubbleGradient)"
          opacity=".96"
          d="M500 105
             C520 83 550 80 580 84
             C613 88 638 103 645 129
             C652 156 640 182 620 202
             C600 222 570 228 540 221
             C510 215 488 195 481 169
             C475 144 483 121 500 105Z">

      <!-- Organic smooth morph -->
      <animate attributeName="d"
        dur="7s"
        repeatCount="indefinite"
        values="
        M500 105 C520 83 550 80 580 84 C613 88 638 103 645 129 C652 156 640 182 620 202 C600 222 570 228 540 221 C510 215 488 195 481 169 C475 144 483 121 500 105Z;

        M486 116 C503 89 535 78 568 82 C604 85 635 102 646 129 C657 157 646 187 624 207 C601 228 568 232 537 223 C505 215 483 193 478 166 C474 145 478 129 486 116Z;

        M500 105 C520 83 550 80 580 84 C613 88 638 103 645 129 C652 156 640 182 620 202 C600 222 570 228 540 221 C510 215 488 195 481 169 C475 144 483 121 500 105Z"/>

      <!-- Smooth movement -->
      <animateTransform attributeName="transform"
        type="translate"
        values="0 0; 13 -7; -10 7; 0 0"
        dur="10s"
        repeatCount="indefinite"/>

      <animateTransform attributeName="transform"
        additive="sum"
        type="rotate"
        values="-2 560 155; 2 560 155; -2 560 155"
        dur="11s"
        repeatCount="indefinite"/>
    </path>
  </g>

  <!-- Main name -->
  <text x="600" y="151"
        text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif"
        font-size="58"
        font-weight="700"
        letter-spacing="-1.2"
        fill="#FFFFFF">
    Anish Fauzadr
  </text>

  <!-- Very subtle moving highlight -->
  <ellipse cx="505" cy="106" rx="34" ry="9"
           fill="#FFFFFF" opacity=".035">
    <animate attributeName="cx"
             values="490;670;490"
             dur="6s"
             repeatCount="indefinite"/>
    <animate attributeName="opacity"
             values=".01;.11;.01"
             dur="6s"
             repeatCount="indefinite"/>
  </ellipse>

  <!-- EXACT subtitle line from your reference -->
  <text x="600" y="187"
        text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif"
        font-size="16"
        font-weight="600"
        fill="#E6EDF3">
    Software Developer  ·  AI &amp; Data Enthusiast  ·  Kathmandu, Nepal
  </text>

</svg>